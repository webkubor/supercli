<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>按场景选 CLI — SuperCLI</title>
    <meta
      name="description"
      content="按任务选择 CLI，核对使用前提、限制与官方资料。"
    />
    <meta
      name="theme-color"
      content="#002fa7"
      media="(prefers-color-scheme: light)"
    />
    <meta
      name="theme-color"
      content="#0b0d12"
      media="(prefers-color-scheme: dark)"
    />
    <script>
      // 在首次绘制前落定主题，避免浅色闪一下再变深。
      (() => {
        try {
          const saved = localStorage.getItem("supercli-theme");
          if (saved === "light" || saved === "dark")
            document.documentElement.dataset.theme = saved;
        } catch {}
      })();
    </script>
    <link rel="icon" href="/favicon.svg" />
  </head>
  <body>
    <a class="skip" href="#guide-main">跳到场景指南</a>
    <header class="header wrap standards-header">
      <a class="brand" href="/" aria-label="SuperCLI 首页"
        ><img
          class="brand-lockup"
          src="/brand/supercli-wordmark.svg"
          alt="SuperCLI"
          width="210"
          height="45"
      /></a>
      <nav aria-label="主导航">
        <a href="/#directory">探索 CLI</a><a href="/#use-cases">按场景选工具</a
        ><a href="/standards">收录标准</a>
      </nav>
      <div class="language-switch" aria-label="切换语言">
        <a href="/" data-language="zh" lang="zh-CN" hreflang="zh-CN">中文</a
        ><a href="/en/" data-language="en" lang="en" hreflang="en">EN</a>
      </div>
    </header>
    <main id="guide-main" class="wrap guide-page"><!-- guide-content --></main>
    <footer class="footer wrap">
      <a href="/">SuperCLI</a><a href="/#directory">探索全部工具</a
      ><a href="/standards">收录标准</a>
    </footer>
    <script type="module" src="/src/guides.ts"></script>
  </body>
</html>
